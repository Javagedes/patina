name: Fork QEMU Binary Size E2E

on:
  pull_request:
    branches:
      - test/qemu-size-e2e-base-20261020
  workflow_dispatch:
    inputs:
      triggering-run-id:
        description: Completed PR validation run to post-process.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: write
  statuses: write

jobs:
  validation:
    if: github.event_name == 'pull_request'
    uses: Javagedes/patina-devops/.github/workflows/PatinaQemuPrValidation.yml@fe19f6bacb322c0e669327c8c8234a48655d40c9
    with:
      patina-ref: ${{ github.event.pull_request.head.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      pr-number: ${{ github.event.pull_request.number }}

  post-process:
    if: github.event_name == 'workflow_dispatch'
    uses: Javagedes/patina-devops/.github/workflows/PatinaQemuPrValidationPost.yml@6f7132e0da7a055abf6c70319898f59ac1f73ee5
    with:
      triggering-run-id: ${{ fromJSON(inputs.triggering-run-id || '0') }}
      conclusion: success
